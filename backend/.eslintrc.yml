# ESLint configuration for the HealthScan AI backend (CommonJS / Node 20).
# Legacy config format (eslint@8) so CI can run `npm run lint` directly.
# Rules focus on catching real bugs; stylistic choices live in .editorconfig.
root: true

env:
  node: true
  es2024: true
  jest: true

parserOptions:
  ecmaVersion: 2024
  sourceType: script

extends: eslint:recommended

rules:
  no-unused-vars: [warn, { args: none }]
  no-console: off
  eqeqeq: [error, smart]
  prefer-const: error
  no-var: error
  require-await: error
  no-empty: [error, { allowEmptyCatch: false }]
