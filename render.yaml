# Render blueprint - deploys the HealthScan AI backend and MongoDB.
# The React frontend is deployed separately on Vercel (see frontend/vercel.json).
# Set the listed environment variables in the Render dashboard before deploying.
services:
  - type: web
    name: healthscan-api
    runtime: node
    rootDir: backend
    plan: free
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        fromDatabase:
          name: healthscan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Comma-separated list of allowed front-end origins (your Vercel URL):
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app
      - key: CLIENT_URL
        value: https://your-app.vercel.app

databases:
  - name: healthscan-db
    databaseType: mongodb
    plan: free
