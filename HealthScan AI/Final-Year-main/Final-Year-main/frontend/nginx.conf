server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-lived cache for hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: every unknown route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
