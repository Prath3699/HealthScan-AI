name: 🐛 Bug report
description: Report a reproducible bug in HealthScan AI
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Call API 'POST /api/...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant server or browser logs (run with LOG_LEVEL=debug). Redact any secrets or patient data.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS: Ubuntu 24.04, Node: 20.x, MongoDB: 7.0"
